<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PO Pace Flags — Editoz Club</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --hard: #ff6b6b;
    --soft: #ffd166;
    --ok: #51cf66;
    --link: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: #232838;
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #2b3145; }
  button.primary { background: #3557ea; border-color: #3557ea; }
  button.primary:hover { background: #4566f5; }
  input[type="text"], input[type="number"] {
    background: #0c0e12;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  #status { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .po-group {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .po-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .po-name { font-weight: 600; font-size: 15px; }
  .po-count { color: var(--muted); font-size: 12px; }
  .client-block { margin-top: 10px; }
  .client-name { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  ul.cards { list-style: none; margin: 0 0 4px 0; padding: 0; }
  li.card {
    padding: 6px 0;
    font-size: 13.5px;
    line-height: 1.5;
    border-top: 1px solid #1f232c;
  }
  li.card:first-child { border-top: none; }
  .flag-hard { color: var(--hard); }
  .flag-soft { color: var(--soft); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .status-tag {
    display: inline-block;
    background: #232838;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
    font-size: 14px;
  }
  .errors, .skipped, .scanlist {
    margin-top: 24px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .errors summary, .skipped summary, .scanlist summary { cursor: pointer; }
  table.scan-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 12.5px;
  }
  table.scan-table th, table.scan-table td {
    text-align: left;
    padding: 5px 8px;
    border-top: 1px solid #1f232c;
  }
  table.scan-table th {
    color: var(--muted);
    font-weight: 600;
  }
  table.scan-table tr.row-error td { color: var(--hard); }
  table.scan-table tr.row-flagged td:first-child { color: var(--soft); }
  .scan-table .icon { width: 18px; }
  #scanFilter {
    margin-top: 8px;
  }
  .cadence-banner {
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    margin-bottom: 16px;
    border: 1px solid var(--panel-border);
  }
  .cadence-ok { color: var(--ok); border-color: #24422c; background: #12291a; }
  .cadence-off { color: var(--soft); border-color: #4a3c14; background: #241d0c; }
  .segment-label {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-top: 10px;
    margin-bottom: 2px;
    color: var(--muted);
  }
  .segment-label.segment-overdue { color: var(--hard); }
  .segment-label.segment-behind_pace { color: var(--hard); opacity: 0.85; }
  .segment-label.segment-heads_up { color: var(--soft); }
</style>
</head>
<body>

<header>
  <h1>PO Pace Flags</h1>
  <div class="meta" id="meta">loading…</div>
</header>

<div class="toolbar">
  <button class="primary" id="refreshBtn">Refresh</button>
  <button id="copyAllBtn">Copy full list for Slack</button>
  <button id="copyContentFlagBtn">Copy CONTENT FLAG list</button>
  <label class="meta">Test single client (matches any part of the name): <input type="text" id="clientFilter" placeholder="e.g. lori" size="14"/></label>
  <label class="meta">Lookahead days: <input type="number" id="daysInput" value="5" min="1" max="14" size="3"/></label>
</div>

<div id="status"></div>
<div id="content"></div>

<script>
const contentEl = document.getElementById("content");
const statusEl = document.getElementById("status");
const metaEl = document.getElementById("meta");
let lastFlags = [];
let lastTodayStr = null;

function fmtDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
}

function cardLine(f, forSlack) {
  // Overdue gets its own red-circle icon so it never reads the same as a
  // card that's merely due today (⚠️) - that mix-up was the original ask.
  const icon = f.segment === "overdue" ? "🔴" : f.flag === "hard" ? "⚠️" : "👀";
  const link = forSlack ? `<${f.cardUrl}|${f.cardName}>` : `<a href="${f.cardUrl}" target="_blank" rel="noopener">${f.cardName}</a>`;
  const leadDays = f.leadDays == null ? 1 : f.leadDays;
  const deadline = new Date(new Date(f.publishDate + "T00:00:00Z").getTime() - leadDays * 86400000).toISOString().slice(0, 10);
  const windowLabel = `${leadDays}-day review window`;

  let publishWhen;
  if (f.daysUntil < 0) {
    const daysAgo = Math.abs(f.daysUntil);
    publishWhen = `published ${daysAgo} day${daysAgo === 1 ? "" : "s"} ago (${fmtDate(f.publishDate)})`;
  } else if (f.daysUntil === 0) {
    publishWhen = `publishes today (${fmtDate(f.publishDate)})`;
  } else {
    publishWhen = `publishes ${fmtDate(f.publishDate)}`;
  }

  let note;
  if (f.segment === "overdue") {
    const daysLate = leadDays - f.daysUntil;
    note = `still "${f.status}" — review deadline missed by ${daysLate} day${daysLate === 1 ? "" : "s"} (was due ${fmtDate(deadline)}), ${publishWhen}`;
  } else if (f.segment === "behind_pace") {
    note = `still "${f.status}" — review due today (${windowLabel}), ${publishWhen}`;
  } else {
    note = `still "${f.status}" — heads-up, behind pace, follow up to speed up`;
  }
  return `${icon} ${link} — ${note}`;
}

function groupFlags(flags) {
  const byPo = {};
  for (const f of flags) {
    byPo[f.po] = byPo[f.po] || {};
    byPo[f.po][f.client] = byPo[f.po][f.client] || [];
    byPo[f.po][f.client].push(f);
  }
  return byPo;
}

// Segments, in display order. A card lands in "overdue" the moment its
// review DEADLINE (publishDate - leadDays) has passed - kept separate from
// "behind_pace" (review due today, not yet late) per how this dashboard
// should read.
const SEGMENTS = [
  { key: "overdue", label: "🔴 CRITICAL — review deadline missed" },
  { key: "behind_pace", label: "⚠️ HIGH — review due today" },
  { key: "heads_up", label: "👀 Heads-up" },
];

function splitBySegment(cardFlags) {
  const bySegment = {};
  for (const seg of SEGMENTS) bySegment[seg.key] = [];
  for (const f of cardFlags) {
    (bySegment[f.segment] || (bySegment[f.segment] = [])).push(f);
  }
  return bySegment;
}

function buildSlackText(byPo, poFilter) {
  const lines = [];
  const poNames = poFilter ? [poFilter] : Object.keys(byPo).sort();
  for (const po of poNames) {
    const clients = byPo[po];
    if (!clients) continue;
    lines.push(po);
    for (const client of Object.keys(clients)) {
      lines.push(`Client: ${client}`);
      lines.push("");
      const bySegment = splitBySegment(clients[client]);
      for (const seg of SEGMENTS) {
        const items = bySegment[seg.key];
        if (!items || !items.length) continue;
        lines.push(`*${seg.label}*`);
        for (const f of items) {
          lines.push(`• ${cardLine(f, true)}`);
        }
        lines.push("");
      }
    }
  }
  return lines.join("\n").trim();
}

// PO Name (as it appears in the Project Tracker "PO Name" field) -> Slack
// member ID, so the CONTENT FLAG list below can generate real, notifying
// @mentions (Slack's <@USERID> syntax) instead of plain "@Name" text that
// wouldn't actually ping anyone. Keys are matched case-insensitively.
// Add a PO here the moment you have their ID - anyone not listed still
// shows up (as plain "@Name (no Slack ID on file)") instead of silently
// disappearing from the list.
const PO_SLACK_IDS = {
  "abilasha sivakumar": "U0AK5BH2E85",
  "ashen": "U09MEPNH39P",
  "eshan madushka": "U0A154ZAVUK",
  "himaza zahara": "U0BSN3W0GPL",
  "himaya": "U0C0PAG8JKW",
  "mahima passela": "U0B4CKFJ1B3",
  "nithila": "U0B5238F74K",
  "rovidu": "U09A08362NP",
  "ryan jacob": "U0BB3PQKZGD",
  "tharumal": "U0BJGHFR6CW",
  "vishma": "U07TE8ERQTA",
  "dinith ranasinghe": "U0BT0P874LA",
  "vishaka": "U0AA545PXML",
  "danush": "U0AK5Q8R33K",
  "jithya": "U0BS95JU8R1",
};

function poMention(poName) {
  const id = PO_SLACK_IDS[(poName || "").trim().toLowerCase()];
  return id ? `<@${id}>` : `@${poName} (no Slack ID on file)`;
}

function ordinal(n) {
  const rem100 = n % 100;
  if (rem100 >= 11 && rem100 <= 13) return `${n}th`;
  switch (n % 10) {
    case 1: return `${n}st`;
    case 2: return `${n}nd`;
    case 3: return `${n}rd`;
    default: return `${n}th`;
  }
}

// "Sept" not the usual 3-letter "Sep" - matches how you actually write it
// ("CONTENT FLAG - 9TH SEPT").
const MONTH_ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEPT", "OCT", "NOV", "DEC"];

function contentFlagDateLabel(todayStr) {
  const d = new Date(todayStr + "T00:00:00Z");
  const day = ordinal(d.getUTCDate()).toUpperCase();
  const month = MONTH_ABBR[d.getUTCMonth()];
  return `${day} ${month}`;
}

// Builds the roster-style "CONTENT FLAG" list you post for Sayuni: just
// CRITICAL (overdue) and HIGH (due today) buckets, each PO-client pair
// listed once even if that client has several flagged cards - it's meant
// to answer "who/what needs attention," not repeat every card.
function buildContentFlagText(flags, todayStr) {
  const buckets = {
    overdue: new Map(), // "po|||client" -> {po, client}
    behind_pace: new Map(),
  };
  for (const f of flags) {
    const bucket = buckets[f.segment];
    if (!bucket) continue;
    const key = `${f.po}|||${f.client}`;
    if (!bucket.has(key)) bucket.set(key, { po: f.po, client: f.client });
  }

  function sortedPairs(map) {
    return Array.from(map.values()).sort((a, b) => a.po.localeCompare(b.po) || a.client.localeCompare(b.client));
  }

  const lines = [];
  lines.push(`*CONTENT FLAG - ${contentFlagDateLabel(todayStr)}*`);
  lines.push("");
  lines.push(`🔴 *CRITICAL - client review deadline already missed, still not ready*`);
  lines.push("");
  for (const { po, client } of sortedPairs(buckets.overdue)) {
    lines.push(`${poMention(po)} - ${client}`);
  }
  lines.push("");
  lines.push(`🟠 *HIGH - client review is due today, still not ready*`);
  lines.push("");
  for (const { po, client } of sortedPairs(buckets.behind_pace)) {
    lines.push(`${poMention(po)} - ${client}`);
  }
  return lines.join("\n").trim();
}

function cadenceBanner(status) {
  if (!status) return "";
  if (status.connected) {
    return `<div class="cadence-banner cadence-ok">✅ Cadence sheet connected — ${status.rowCount} client row(s) read. Clients not listed there use the default 24hr rule.</div>`;
  }
  return `<div class="cadence-banner cadence-off">⚠️ Cadence sheet not connected (${status.error || "unknown reason"}) — every client is using the default 24hr rule right now.</div>`;
}

function render(data) {
  lastFlags = data.flags || [];
  lastTodayStr = data.today || null;
  const lookback = data.lookbackDays != null ? ` · lookback ${data.lookbackDays}d` : "";
  metaEl.textContent = `generated ${new Date(data.generatedAt).toLocaleString()} · scanned ${data.clientsScanned} active client(s) · lookahead ${data.windowDays}d${lookback}`;

  const bannerHtml = cadenceBanner(data.cadenceStatus);

  if (!lastFlags.length) {
    contentEl.innerHTML = bannerHtml + '<div class="empty">No flagged cards right now 🎉</div>';
  } else {
    const byPo = groupFlags(lastFlags);
    let html = "";
    for (const po of Object.keys(byPo).sort()) {
      const clients = byPo[po];
      const total = Object.values(clients).reduce((n, arr) => n + arr.length, 0);
      html += `<div class="po-group" data-po="${po}">`;
      html += `<div class="po-header"><span class="po-name">${po}</span>`;
      html += `<span><span class="po-count">${total} flagged</span> <button class="copyPoBtn" data-po="${po}">Copy</button></span></div>`;
      for (const client of Object.keys(clients)) {
        html += `<div class="client-block"><div class="client-name">Client: ${client}</div>`;
        const bySegment = splitBySegment(clients[client]);
        for (const seg of SEGMENTS) {
          const items = bySegment[seg.key];
          if (!items || !items.length) continue;
          html += `<div class="segment-label segment-${seg.key}">${seg.label} (${items.length})</div><ul class="cards">`;
          for (const f of items) {
            html += `<li class="card flag-${f.flag}">${cardLine(f, false)} <span class="status-tag">${f.status}</span></li>`;
          }
          html += `</ul>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    contentEl.innerHTML = bannerHtml + html;

    document.querySelectorAll(".copyPoBtn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const po = btn.dataset.po;
        const text = buildSlackText(groupFlags(lastFlags), po);
        navigator.clipboard.writeText(text).then(() => {
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = "Copy"), 1200);
        });
      });
    });
  }

  let extra = "";
  if (data.skipped && data.skipped.length) {
    extra += `<details class="skipped"><summary>${data.skipped.length} client(s) skipped (no Content Board Data Source ID)<ul>`;
    data.skipped.forEach((s) => (extra += `<li>${s.client} — ${s.reason}</li>`));
    extra += `</ul></details>`;
  }
  if (data.errors && data.errors.length) {
    extra += `<details class="errors"><summary>${data.errors.length} client(s) errored while scanning</summary><ul>`;
    data.errors.forEach((e) => (extra += `<li>${e.client} — ${e.error}</li>`));
    extra += `</ul></details>`;
  }
  if (data.scanned && data.scanned.length) {
    extra += `<details class="scanlist"><summary>Full scan results — every active client checked (${data.scanned.length})</summary>`;
    extra += `<table class="scan-table"><thead><tr><th class="icon"></th><th>Client</th><th>PO</th><th>Review window</th><th>Cards checked</th><th>Flagged</th><th>Notes</th></tr></thead><tbody>`;
    data.scanned.forEach((s) => {
      const icon = s.error ? "❌" : s.flaggedCount > 0 ? "⚠️" : "✅";
      const rowClass = s.error ? "row-error" : s.flaggedCount > 0 ? "row-flagged" : "";
      const cadenceCell = s.cadenceSource ? s.cadenceSource.replace(/^sheet:/, "📋 sheet:").replace(/^default/, "🔹 default") : "—";
      extra += `<tr class="${rowClass}"><td class="icon">${icon}</td><td>${s.client}</td><td>${s.po}</td><td>${cadenceCell}</td><td>${s.cardsChecked}</td><td>${s.flaggedCount}</td><td>${s.error || ""}</td></tr>`;
    });
    extra += `</tbody></table></details>`;
  }
  contentEl.innerHTML += extra;
}

async function load() {
  statusEl.textContent = "Scanning Notion…";
  contentEl.innerHTML = "";
  const client = document.getElementById("clientFilter").value.trim();
  const days = document.getElementById("daysInput").value.trim();
  const params = new URLSearchParams();
  if (client) params.set("client", client);
  if (days) params.set("days", days);
  try {
    const res = await fetch("/api/flags?" + params.toString());
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Unknown error");
    statusEl.textContent = "";
    render(data);
  } catch (e) {
    statusEl.textContent = "";
    contentEl.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

document.getElementById("refreshBtn").addEventListener("click", load);
document.getElementById("copyAllBtn").addEventListener("click", () => {
  const text = buildSlackText(groupFlags(lastFlags));
  navigator.clipboard.writeText(text || "Nothing flagged right now.").then(() => {
    const btn = document.getElementById("copyAllBtn");
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = "Copy full list for Slack"), 1200);
  });
});
document.getElementById("copyContentFlagBtn").addEventListener("click", () => {
  const todayStr = lastTodayStr || new Date().toISOString().slice(0, 10);
  const text = buildContentFlagText(lastFlags, todayStr);
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyContentFlagBtn");
    btn.textContent = "Copied!";
    setTimeout(() => (btn.textContent = "Copy CONTENT FLAG list"), 1200);
  });
});

load();
</script>

</body>
</html>
